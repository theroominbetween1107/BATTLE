:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0b0710;--fg:#e8dfff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0710;--fg:#e8dfff}}
:root[data-theme="dark"]{--bg:#0b0710;--fg:#e8dfff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;height:100dvh;overflow:hidden}
canvas{display:block;width:min(100vw,calc(100vh*4/3));width:min(100vw,calc(100dvh*4/3));height:auto;aspect-ratio:4/3;touch-action:none;background:#000}
p{font-size:13px;opacity:.7;margin:8px;text-align:center}

@font-face{font-family:"MS Sans Serif";src:url("../fonts/MS_Sans_Serif.ttf") format("truetype")}
#lock-screen{position:fixed;inset:0;z-index:9999;display:flex;justify-content:center;align-items:center;background:#c0c0c0;font-family:"MS Sans Serif",Arial,sans-serif;color:#000}
#lock-screen *{font-family:"MS Sans Serif",Arial,sans-serif}
.lock-box{width:300px;background:#c0c0c0;border:2px solid #fff;box-shadow:inset -2px -2px #808080,inset 2px 2px #dfdfdf}
.lock-title-bar{background:navy;color:#fff;padding:3px 5px;font-size:13px}
.lock-content{padding:15px}
.lock-content p{margin-top:0}
.lock-input{width:100%;box-sizing:border-box;margin:8px 0 12px 0;border:2px solid #808080;box-shadow:inset 1px 1px #000,inset -1px -1px #fff;padding:4px}
.lock-button{display:block;margin-left:auto;min-width:55px;padding:3px 10px;background:#c0c0c0;border:2px solid #fff;box-shadow:inset -1px -1px #808080,inset 1px 1px #fff;cursor:pointer}
.lock-button:active{box-shadow:inset 1px 1px #808080,inset -1px -1px #fff}
#lock-error{color:#800000;font-size:12px;min-height:14px}
</style></head><body>
<div id="lock-screen">
  <div class="lock-box">
    <div class="lock-title-bar">Game Access</div>
    <div class="lock-content">
      <p>This directory is protected.</p>
      <label for="lock-pass">Password:</label>
      <input type="password" id="lock-pass" class="lock-input" autocomplete="off">
      <div id="lock-error"></div>
      <button class="lock-button" id="lock-ok">OK</button>
    </div>
  </div>
</div>

(function () {
  const screen = document.getElementById("lock-screen");
  const input = document.getElementById("lock-pass");

  function check() {
    if (input.value.trim().toUpperCase() === GAME_PASSWORD.toUpperCase()) {

      input.value = "";
